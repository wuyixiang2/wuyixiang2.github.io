<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>drive</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    h3 { font-size: 18px; margin-bottom: 4px; }
    #identity-hint {
      font-size: 13px;
      color: #495057;
      margin-bottom: 12px;
    }
    #upload-area {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    #upload-area input[type="file"] {
      flex: 1;
      min-width: 200px;
      font-size: 14px;
    }
    button {
      padding: 6px 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #e9ecef; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 12px;
      min-height: 18px;
    }
    #status.ok { color: #0a7c2f; }
    #status.err { color: #c92a2a; }
    #file-list {
      list-style: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
    }
    #file-list li {
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    #file-list li:last-child { border-bottom: none; }
    .file-name {
      word-break: break-all;
      margin-right: 12px;
    }
    .file-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      white-space: nowrap;
    }
    .download-link {
      color: #0d6efd;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
    }
    .delete-link {
      color: #c92a2a;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
    }
    .delete-link:hover { color: #8b0000; }
    .empty-tip {
      color: #6c757d;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h3>Drive</h3>
  <div id="identity-hint"></div>

  <div id="upload-area">
    <input type="file" id="fileInput">
    <button id="uploadBtn">上传</button>
  </div>

  <div id="status">就绪</div>

  <ul id="file-list"></ul>

  <script>
    const SUPABASE_URL = 'https://tsizgxzjylnbtrpczeyj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzaXpneHpqeWxuYnRycGN6ZXlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NjcyMzksImV4cCI6MjEwNzM0MzIzOX0.NoQf2rH5Kl6fbohNARIkF6ZLXtiWGcBUXTExzeJS3is';
    const BUCKET = 'drive';

    // 匿名标记
    const ANON_MARKER = '__anon__';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');
    const fileList = document.getElementById('file-list');
    const identityHint = document.getElementById('identity-hint');

    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = type || '';
    }

    // ========== 当前用户 ==========
    function getCurrentUser() {
      const nickname = localStorage.getItem('userNickname');
      return (nickname && nickname.trim() !== '') ? nickname.trim() : ANON_MARKER;
    }

    function updateIdentityHint() {
      const u = getCurrentUser();
      identityHint.textContent = (u === ANON_MARKER)
        ? '当前身份：Anonymous（仅显示匿名文件）'
        : '当前身份：' + u + '（仅显示你自己上传的文件）';
    }

    // ========== base64url 编解码 ==========
    function utf8ToBase64Url(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      bytes.forEach(function(b) { binary += String.fromCharCode(b); });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function base64UrlToUtf8(str) {
      let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    // ========== key 生成与解析 ==========
    // 新格式：v2.<ts>.<b64user>.<b64name>
    function makeSafeKey(originalName) {
      const user = getCurrentUser();
      return 'v2.' + Date.now() + '.' + utf8ToBase64Url(user) + '.' + utf8ToBase64Url(originalName);
    }

    // 解析 key，返回 { user, name }
    function parseKey(key) {
      if (!key) return { user: ANON_MARKER, name: '' };

      if (key.indexOf('v2.') === 0) {
        const parts = key.split('.');
        // 新格式：4 段及以上
        if (parts.length >= 4) {
          try {
            return {
              user: base64UrlToUtf8(parts[2]),
              name: base64UrlToUtf8(parts.slice(3).join('.'))
            };
          } catch (e) {}
        }
        // 旧 v2 格式：3 段，视为匿名
        if (parts.length === 3) {
          try {
            return {
              user: ANON_MARKER,
              name: base64UrlToUtf8(parts.slice(2).join('.'))
            };
          } catch (e) {}
        }
      }
      // 更早的格式，原样作为名字，视为匿名
      return { user: ANON_MARKER, name: key };
    }

    // ========== 下载 ==========
    async function downloadFile(key, displayName) {
      setStatus('下载中：' + displayName);

      const { data, error } = await supabaseClient
        .storage
        .from(BUCKET)
        .download(key);

      if (error) {
        console.error('下载失败:', error);
        setStatus('下载失败：' + error.message, 'err');
        return;
      }

      const url = URL.createObjectURL(data);
      const a = document.createElement('a');
      a.href = url;
      a.download = displayName || key;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setStatus('已开始下载：' + displayName, 'ok');
    }
    async function deleteFile(key, displayName) {
      if (!confirm('确定删除「' + displayName + '」吗？此操作不可撤销。')) return;

      setStatus('删除中：' + displayName);

      const { error } = await supabaseClient
        .storage
        .from(BUCKET)
        .remove([key]);

      if (error) {
        console.error('删除失败:', error);
        setStatus('删除失败：' + error.message, 'err');
        return;
      }
      setStatus('已删除：' + displayName, 'ok');
      listFiles();
    }
    async function listFiles() {
      const { data, error } = await supabaseClient
        .storage
        .from(BUCKET)
        .list('', {
          limit: 500,
          sortBy: { column: 'created_at', order: 'desc' }
        });

      fileList.innerHTML = '';

      if (error) {
        console.error('列出文件失败:', error);
        fileList.innerHTML = '<li class="empty-tip">加载失败，请刷新重试</li>';
        return;
      }
      const currentUser = getCurrentUser();
      const visible = (data || [])
        .filter(function(f) { return f.id !== null && f.name; })
        .map(function(f) {
          const info = parseKey(f.name);
          return { key: f.name, user: info.user, name: info.name };
        })
        .filter(function(item) {
          return item.user === currentUser;
        });

      if (visible.length === 0) {
        fileList.innerHTML = '<li class="empty-tip">暂无文件</li>';
        return;
      }

      visible.forEach(function(item) {
        const li = document.createElement('li');

        const nameSpan = document.createElement('span');
        nameSpan.className = 'file-name';
        nameSpan.textContent = item.name;

        const actions = document.createElement('span');
        actions.className = 'file-actions';

        const dlLink = document.createElement('a');
        dlLink.className = 'download-link';
        dlLink.textContent = '下载';
        dlLink.addEventListener('click', function() {
          downloadFile(item.key, item.name);
        });

        const delLink = document.createElement('a');
        delLink.className = 'delete-link';
        delLink.textContent = '删除';
        delLink.addEventListener('click', function() {
          deleteFile(item.key, item.name);
        });

        actions.appendChild(dlLink);
        actions.appendChild(delLink);
        li.appendChild(nameSpan);
        li.appendChild(actions);
        fileList.appendChild(li);
      });
    }
    async function uploadFile() {
      const file = fileInput.files[0];
      if (!file) {
        setStatus('请先选择文件', 'err');
        return;
      }
      const originalName = file.name;
      const safeKey = makeSafeKey(originalName);
      uploadBtn.disabled = true;
      setStatus('上传进度： 0%');
      const url = SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + encodeURIComponent(safeKey);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
      xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);

      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
          const percent = Math.round(e.loaded / e.total * 100);
          setStatus('上传进度： ' + percent + '%');
        }
      };
      xhr.onload = function() {
        uploadBtn.disabled = false;
        if (xhr.status >= 200 && xhr.status < 300) {
          setStatus('上传成功：' + originalName + ' (100%)', 'ok');
          fileInput.value = '';
          listFiles();
        } else {
          let msg = xhr.responseText || ('HTTP ' + xhr.status);
          try {
            const j = JSON.parse(xhr.responseText);
            msg = j.message || msg;
          } catch (e) {}
          setStatus('上传失败：' + msg, 'err');
        }
      };
      xhr.onerror = function() {
        uploadBtn.disabled = false;
        setStatus('上传失败：网络错误', 'err');
      };
      xhr.send(file);
    }
    function init() {
      updateIdentityHint();
      listFiles();
      uploadBtn.addEventListener('click', uploadFile);
      window.addEventListener('storage', function(e) {
        if (e.key === 'userNickname') {
          updateIdentityHint();
          listFiles();
        }
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>

</body>
</html>
