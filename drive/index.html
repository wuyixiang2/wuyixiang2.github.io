<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>drive</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    h3 { font-size: 18px; margin-bottom: 12px; }
    #upload-area {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    #upload-area input[type="file"] {
      flex: 1;
      min-width: 200px;
      font-size: 14px;
    }
    button {
      padding: 6px 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #e9ecef; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 12px;
      min-height: 18px;
    }
    #status.ok { color: #0a7c2f; }
    #status.err { color: #c92a2a; }
    #file-list {
      list-style: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
    }
    #file-list li {
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    #file-list li:last-child { border-bottom: none; }
    .file-name {
      word-break: break-all;
      margin-right: 12px;
    }
    .download-link {
      color: #0d6efd;
      text-decoration: underline;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
    }
    .empty-tip {
      color: #6c757d;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h3>Drive</h3>

  <div id="upload-area">
    <input type="file" id="fileInput">
    <button id="uploadBtn">上传</button>
  </div>

  <div id="status">就绪</div>

  <ul id="file-list"></ul>

  <script>
    const SUPABASE_URL = 'https://tsizgxzjylnbtrpczeyj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzaXpneHpqeWxuYnRycGN6ZXlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NjcyMzksImV4cCI6MjEwNzM0MzIzOX0.NoQf2rH5Kl6fbohNARIkF6ZLXtiWGcBUXTExzeJS3is';
    const BUCKET = 'drive';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');
    const fileList = document.getElementById('file-list');

    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = type || '';
    }
    function utf8ToBase64Url(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      bytes.forEach(function(b) { binary += String.fromCharCode(b); });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function base64UrlToUtf8(str) {
      let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }
    
    function makeSafeKey(originalName) {
      return 'v2.' + Date.now() + '.' + utf8ToBase64Url(originalName);
    }
    function keyToDisplayName(key) {
      if (!key || key.indexOf('v2.') !== 0) return key;
      const parts = key.split('.');
      if (parts.length < 3) return key;
      try {
        return base64UrlToUtf8(parts.slice(2).join('.'));
      } catch (e) {
        return key;
      }
    }
    async function listFiles() {
      const { data, error } = await supabaseClient
        .storage
        .from(BUCKET)
        .list('', {
          limit: 200,
          sortBy: { column: 'created_at', order: 'desc' }
        });
    
      fileList.innerHTML = '';
    
      if (error) {
        console.error('列出文件失败:', error);
        fileList.innerHTML = '<li class="empty-tip">加载失败，请刷新重试</li>';
        return;
      }
    
      const files = (data || []).filter(function(f) {
        return f.id !== null && f.name;
      });
    
      if (files.length === 0) {
        fileList.innerHTML = '<li class="empty-tip">暂无文件</li>';
        return;
      }
    
      files.forEach(function(f) {
        // 优先显示原始文件名，没有则回退到存储 key
        const displayName = (f.metadata && f.metadata.originalName) ? f.metadata.originalName : f.name;
    
        const li = document.createElement('li');
    
        const nameSpan = document.createElement('span');
        nameSpan.className = 'file-name';
        nameSpan.textContent = displayName;
    
        const dlLink = document.createElement('a');
        dlLink.className = 'download-link';
        dlLink.textContent = '下载';
        dlLink.addEventListener('click', function() {
          downloadFile(f.name, displayName);   // key 用于下载，displayName 用于保存
        });
    
        li.appendChild(nameSpan);
        li.appendChild(dlLink);
        fileList.appendChild(li);
      });
    }
    function sanitizeFileName(name) {
      let safe = name.replace(/\s+/g, '_');
      safe = safe.replace(/[^a-zA-Z0-9._-]/g, '');
      return safe || 'unnamed_file';
    }
    async function uploadFile() {
      const file = fileInput.files[0];
      if (!file) {
        setStatus('请先选择文件', 'err');
        return;
      }
    
      const originalName = file.name;
      const safeKey = makeSafeKey(originalName);
    
      uploadBtn.disabled = true;
      setStatus('上传进度： 0%');
      const url = SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + encodeURIComponent(safeKey);
    
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
      xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
          const percent = Math.round(e.loaded / e.total * 100);
          setStatus('上传进度： ' + percent + '%');
        }
      };
      xhr.onload = function() {
        uploadBtn.disabled = false;
        if (xhr.status >= 200 && xhr.status < 300) {
          setStatus('上传成功：' + originalName + ' (100%)', 'ok');
          fileInput.value = '';
          listFiles();
        } else {
          let msg = xhr.responseText || ('HTTP ' + xhr.status);
          try {
            const j = JSON.parse(xhr.responseText);
            msg = j.message || msg;
          } catch (e) {}
          setStatus('上传失败：' + msg, 'err');
        }
      };
      xhr.onerror = function() {
        uploadBtn.disabled = false;
        setStatus('上传失败：网络错误', 'err');
      };
      xhr.send(file);
    }
    async function listFiles() {
      const { data, error } = await supabaseClient
        .storage
        .from(BUCKET)
        .list('', {
          limit: 200,
          sortBy: { column: 'created_at', order: 'desc' }
        });
    
      fileList.innerHTML = '';
    
      if (error) {
        console.error('列出文件失败:', error);
        fileList.innerHTML = '<li class="empty-tip">加载失败，请刷新重试</li>';
        return;
      }
    
      const files = (data || []).filter(function(f) {
        return f.id !== null && f.name;
      });
    
      if (files.length === 0) {
        fileList.innerHTML = '<li class="empty-tip">暂无文件</li>';
        return;
      }
    
      files.forEach(function(f) {
        const displayName = keyToDisplayName(f.name);
    
        const li = document.createElement('li');
    
        const nameSpan = document.createElement('span');
        nameSpan.className = 'file-name';
        nameSpan.textContent = displayName;
    
        const dlLink = document.createElement('a');
        dlLink.className = 'download-link';
        dlLink.textContent = '下载';
        dlLink.addEventListener('click', function() {
          downloadFile(f.name, displayName);
        });
    
        li.appendChild(nameSpan);
        li.appendChild(dlLink);
        fileList.appendChild(li);
      });
    }
    function init() {
      uploadBtn.addEventListener('click', uploadFile);
      listFiles();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>

</body>
</html>
