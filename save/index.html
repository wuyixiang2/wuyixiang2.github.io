<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>save</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }
    h2 { font-size: 18px; margin-bottom: 12px; font-weight: 600; }
    label { display: block; font-size: 14px; color: #495057; margin: 10px 0 4px; }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      font-family: inherit;
      background: white;
    }
    textarea {
      min-height: 45vh;
      font-family: "Consolas", "Monaco", "Courier New", monospace;
      line-height: 1.5;
      resize: vertical;
    }
    button {
      padding: 8px 18px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      margin-right: 6px;
    }
    button:hover { background: #e9ecef; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      font-size: 14px;
      color: #495057;
      margin-top: 10px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #status.ok { color: #0a7c2f; }
    #status.err { color: #c92a2a; }
    details {
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      background: white;
    }
    details summary { cursor: pointer; font-size: 14px; color: #495057; }
  </style>
</head>
<body>

  <h2>保存代码到 paste/{编号}</h2>

  <details id="settingsPanel">
    <summary>GitHub 设置（首次使用需填写，会保存在本浏览器）</summary>
    <label>仓库所有者（用户名或组织名）</label>
    <input type="text" id="ghOwner" placeholder="例如 wuyixiang2">
    <label>仓库名</label>
    <input type="text" id="ghRepo" placeholder="例如 wuyixiang2.github.io">
    <label>分支</label>
    <input type="text" id="ghBranch" placeholder="main" value="main">
    <label>Personal Access Token</label>
    <input type="password" id="ghToken" placeholder="ghp_...">
    <button id="saveSettings">保存设置</button>
  </details>

  <label>编号（paste/ 后面的部分）</label>
  <input type="text" id="pasteId" placeholder="例如 2026100802">

  <label>代码内容（直接粘贴原始 C++ 代码即可，无需转义）</label>
  <textarea id="codeInput" placeholder="在这里粘贴代码..."></textarea>

  <div>
    <button id="submitBtn">生成并上传</button>
    <button id="previewBtn">本地预览</button>
  </div>

  <div id="status"></div>

  <script>
    // ---------- 配置存取 ----------
    const CFG_KEY = 'paste_save_config';

    function loadConfig() {
      try {
        const raw = localStorage.getItem(CFG_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) { return null; }
    }
    function saveConfig(cfg) {
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    }
    function applyConfigToForm() {
      const cfg = loadConfig();
      if (!cfg) return;
      document.getElementById('ghOwner').value = cfg.owner || '';
      document.getElementById('ghRepo').value = cfg.repo || '';
      document.getElementById('ghBranch').value = cfg.branch || 'main';
      document.getElementById('ghToken').value = cfg.token || '';
    }

    // ---------- HTML 转义（用于嵌入代码） ----------
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // ---------- 生成页面 HTML（风格与你现有页面一致） ----------
    function buildPageHtml(id, code) {
      return `<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>paste/${id}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      padding: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }
    pre {
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 16px;
      overflow-x: auto;
      font-family: "Consolas", "Monaco", "Courier New", monospace;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre;
      tab-size: 4;
    }
    code { font-family: inherit; }
  </style>
</head>
<body>
  <pre><code class="language-cpp">${escapeHtml(code)}</code></pre>
  <script>hljs.highlightAll();<\/script>
</body>
</html>`;
    }

    // ---------- base64 编码（支持中文） ----------
    function toBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin);
    }

    // ---------- 提交到 GitHub ----------
    async function uploadToGitHub(cfg, path, content, commitMsg) {
      const apiBase = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
      const headers = {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      // 1. 查询文件是否已存在，拿到 sha
      let sha = null;
      const getRes = await fetch(`${apiBase}?ref=${encodeURIComponent(cfg.branch)}`, { headers });
      if (getRes.ok) {
        const data = await getRes.json();
        sha = data.sha;
      } else if (getRes.status !== 404) {
        const err = await getRes.json().catch(() => ({}));
        throw new Error(`查询失败（${getRes.status}）：${err.message || '未知错误'}`);
      }

      // 2. PUT 创建或更新
      const body = {
        message: commitMsg,
        content: toBase64(content),
        branch: cfg.branch
      };
      if (sha) body.sha = sha;

      const putRes = await fetch(apiBase, {
        method: 'PUT',
        headers,
        body: JSON.stringify(body)
      });

      if (!putRes.ok) {
        const err = await putRes.json().catch(() => ({}));
        throw new Error(`提交失败（${putRes.status}）：${err.message || '未知错误'}`);
      }
      return await putRes.json();
    }

    // ---------- 状态提示 ----------
    const statusEl = document.getElementById('status');
    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type || '';
    }

    // ---------- 事件绑定 ----------
    document.getElementById('saveSettings').addEventListener('click', function() {
      const cfg = {
        owner: document.getElementById('ghOwner').value.trim(),
        repo: document.getElementById('ghRepo').value.trim(),
        branch: document.getElementById('ghBranch').value.trim() || 'main',
        token: document.getElementById('ghToken').value.trim()
      };
      if (!cfg.owner || !cfg.repo || !cfg.token) {
        setStatus('请填写完整的 owner、repo、token', 'err');
        return;
      }
      saveConfig(cfg);
      setStatus('设置已保存到本浏览器', 'ok');
    });

    // 本地预览
    document.getElementById('previewBtn').addEventListener('click', function() {
      const id = document.getElementById('pasteId').value.trim() || 'preview';
      const code = document.getElementById('codeInput').value;
      if (!code) { setStatus('请先输入代码', 'err'); return; }
      const html = buildPageHtml(id, code);
      const w = window.open('', '_blank');
      w.document.open();
      w.document.write(html);
      w.document.close();
    });

    // 生成并上传
    document.getElementById('submitBtn').addEventListener('click', async function() {
      const id = document.getElementById('pasteId').value.trim();
      const code = document.getElementById('codeInput').value;
      const cfg = loadConfig();

      if (!id || !/^[A-Za-z0-9_-]+$/.test(id)) {
        setStatus('编号不能为空，且只能包含字母、数字、下划线、短横线', 'err');
        return;
      }
      if (!code) { setStatus('请输入代码内容', 'err'); return; }
      if (!cfg || !cfg.owner || !cfg.repo || !cfg.token) {
        setStatus('请先在“GitHub 设置”中填写并保存配置', 'err');
        document.getElementById('settingsPanel').open = true;
        return;
      }

      this.disabled = true;
      setStatus('正在生成并上传...');

      try {
        const html = buildPageHtml(id, code);
        const path = `paste/${id}/index.html`;
        await uploadToGitHub(cfg, path, html, `Add paste ${id}`);
        setStatus(
          '上传成功！\n' +
          'GitHub Pages 通常 1–2 分钟后生效。\n' +
          '访问地址：https://paste.aaa.com/' + id
        , 'ok');
      } catch (e) {
        setStatus('出错：' + e.message, 'err');
      } finally {
        this.disabled = false;
      }
    });

    // 初始化
    applyConfigToForm();
  </script>

</body>
</html>
