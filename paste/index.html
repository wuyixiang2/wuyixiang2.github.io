<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>paste</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
    }
    #editor {
      flex: 1;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1.5;
      font-family: "Consolas", "Monaco", "Courier New", monospace;
      resize: none;
      outline: none;
      background: white;
    }
    #toolbar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    #toolbar button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      font-size: 15px;
      cursor: pointer;
    }
    #toolbar button:hover { background: #e9ecef; }
    #status {
      font-size: 13px;
      color: #6c757d;
      margin-top: 4px;
    }
    #status.ok { color: #0a7c2f; }
    #status.err { color: #c92a2a; }
  </style>
</head>
<body>

  <textarea id="editor" placeholder="在这里粘贴或输入内容..."></textarea>

  <div id="toolbar">
    <button id="copyBtn">复制全部</button>
    <button id="clearBtn">清空</button>
  </div>

  <div id="status">连接中...</div>

  <script>
    const SUPABASE_URL = 'https://csgdiykteirmaokvraqu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzZ2RpeWt0ZWlybWFva3ZyYXF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NjgzNjAsImV4cCI6MjEwNzM0NDM2MH0.QiajIsyTQCTzZ_50pBUXPah00D4lwUdEWc4AjYH6BQo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const editor = document.getElementById('editor');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const status = document.getElementById('status');
    let lastSyncedContent = '';
    let isEditing = false;
    let saveTimer = null;
    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = type || '';
    }
    async function loadFromCloud() {
      const { data, error } = await supabaseClient
        .from('paste_board')
        .select('content, updated_at')
        .eq('id', 1)
        .single();

      if (error) {
        console.error('读取失败:', error);
        setStatus('读取失败，请刷新重试', 'err');
        return;
      }

      editor.value = data.content || '';
      lastSyncedContent = data.content || '';
      setStatus('已连接 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }), 'ok');
    }
    async function saveToCloud() {
      const content = editor.value;
      if (content === lastSyncedContent) return;

      const { error } = await supabaseClient
        .from('paste_board')
        .update({ content: content, updated_at: new Date().toISOString() })
        .eq('id', 1);

      if (error) {
        console.error('保存失败:', error);
        setStatus('保存失败：' + error.message, 'err');
        return;
      }

      lastSyncedContent = content;
      setStatus('已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }), 'ok');
    }
    function scheduleSave() {
      isEditing = true;
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(async function() {
        await saveToCloud();
        isEditing = false;
      }, 600);
    }
    function subscribeRealtime() {
      supabaseClient
        .channel('public:paste_board')
        .on(
          'postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'paste_board', filter: 'id=eq.1' },
          function(payload) {
            const remoteContent = payload.new.content || '';
            if (remoteContent === lastSyncedContent) return;
            if (isEditing) return;
            if (remoteContent === editor.value) {
              lastSyncedContent = remoteContent;
              return;
            }
            editor.value = remoteContent;
            lastSyncedContent = remoteContent;
            setStatus('已同步远端更新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }), 'ok');
          }
        )
        .subscribe(function(s) {
          console.log('[Realtime] 订阅状态:', s);
        });
    }
    function copyAll() {
      editor.select();
      editor.setSelectionRange(0, editor.value.length);
      try {
        navigator.clipboard.writeText(editor.value).then(function() {
          setStatus('已复制全部内容', 'ok');
        }).catch(function() {
          document.execCommand('copy');
          setStatus('已复制全部内容（兼容模式）', 'ok');
        });
      } catch (e) {
        document.execCommand('copy');
        setStatus('已复制全部内容（兼容模式）', 'ok');
      }
      window.getSelection().removeAllRanges();
    }
    async function clearAll() {
      if (editor.value === '') return;
      if (!confirm('确定要清空所有内容吗？此操作会同步到所有设备，不可撤销。')) return;
      editor.value = '';
      await saveToCloud();
      editor.focus();
    }
    async function init() {
      await loadFromCloud();
      subscribeRealtime();
      editor.addEventListener('input', scheduleSave);
      copyBtn.addEventListener('click', copyAll);
      clearBtn.addEventListener('click', clearAll);
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          if (saveTimer) clearTimeout(saveTimer);
          saveToCloud();
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>

</body>
</html>
