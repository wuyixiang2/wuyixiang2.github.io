  <style>

<body>
  <div id="mode-switcher">
    <button data-mode="cpp" class="active">.cpp</button>
    <button data-mode="markdown">markdown(LaTeX)</button>
  </div>

  <div id="content"></div>

  <textarea id="rawSource" style="display:none">#include &lt;iostream&gt;
#include &lt;cmath&gt;
#include &lt;algorithm&gt;
#include &lt;vector&gt;
#define int long long
using namespace std;
int n,top;
struct node
{
	int x,y;
}stk[200005];
bool cmp(node e,node f)
{
	if(e.x != f.x)return e.x &lt; f.x;
	return e.y &lt; f.y;
}
inline node jia(node b,node c)
{
	b.x += c.x;b.y += c.y;
	return b;
}
inline node jian(node b,node c)
{
	b.x -= c.x;b.y -= c.y;
	return b;
}
inline int chazhi(node b,node c,node d)
{
	c = jian(c,b);
	d = jian(d,b);
	return c.x * d.y - c.y * d.x;
}
bool cmp2(node b,node c)
{
    return (chazhi(b,c,{0,0}) &gt; 0 || (chazhi(b,c,{0,0}) == 0 &amp;&amp; (b.x &gt; c.x || (b.x == c.x &amp;&amp; b.y &gt; c.y))));
}
vector&lt;node&gt; tu_bao(vector&lt;node&gt;a)
{
    top = 0;
    sort(a.begin(),a.end(),cmp);
    int w = a.size();
    vector&lt;node&gt;res;
    for(int i = 0;i &lt; w;i ++)
	{
		while(top &gt; 1 &amp;&amp; chazhi(stk[top - 1],stk[top],a[i]) &lt;= 0)top --;
		stk[++top] = a[i];
	}
	int kat = top;
	for(int i = w - 2;i &gt;= 0;i --)
	{
		while(top &gt; kat &amp;&amp; chazhi(stk[top - 1],stk[top],a[i]) &lt;= 0)top --;
		stk[++top] = a[i];
	}
	for(int i = 1;i &lt; top;i ++)res.push_back(stk[i]);
	return res;
}
vector&lt;node&gt;a[200005];
vector&lt;node&gt; dfs(int x,int y)
{
    if(x == y)return a[x];
    int mid = (x + y) &gt;&gt; 1;
    vector&lt;node&gt;ze = dfs(x,mid),ye = dfs(mid + 1,y);
    ze.push_back(ze[0]),ye.push_back(ye[0]);
    vector&lt;node&gt;res(ze.size() + ye.size() - 1);
    res[0] = jia(ze[0],ye[0]);
    for(int i = 0;i + 1 &lt; ze.size();i ++)ze[i] = jian(ze[i + 1],ze[i]);
    for(int i = 0;i + 1 &lt; ye.size();i ++)ye[i] = jian(ye[i + 1],ye[i]);
    ze.pop_back(),ye.pop_back();
    merge(ze.begin(),ze.end(),ye.begin(),ye.end(),res.begin() + 1,cmp2);
    for(int i = 1;i &lt; res.size();i ++)res[i] = jia(res[i - 1],res[i]);
    return res;
}
void solve()
{
    cin &gt;&gt; n;
    for(int i = 1;i &lt;= n;i ++)a[i].clear();
    for(int i = 1,op,x,y;i &lt;= n;i ++)
    {
        cin &gt;&gt; op;
        while(op --)
        {
            cin &gt;&gt; x &gt;&gt; y;
            a[i].push_back({x,y});
        }
        a[i] = tu_bao(a[i]);
    }
    vector&lt;node&gt;truans = dfs(1,n);
    int maxx = 0;
    for(int i = 0;i &lt; truans.size();i ++)maxx = max(maxx,truans[i].x * truans[i].x + truans[i].y * truans[i].y);
    cout &lt;&lt; maxx &lt;&lt; '\n';
}
signed main()
{
    ios::sync_with_stdio(0);
    cin.tie(0),cout.tie(0);
    solve();
}</textarea>

  <script>
    (function() {
      var rawText = document.getElementById('rawSource').value;
      var currentMode = 'cpp';
      var contentEl = document.getElementById('content');
      var mathRetries = 0;

      function renderCpp() {
        contentEl.innerHTML = '';
        var pre = document.createElement('pre');
        var codeEl = document.createElement('code');
        codeEl.className = 'language-cpp';
        codeEl.textContent = rawText;
        pre.appendChild(codeEl);
        contentEl.appendChild(pre);
        if (typeof hljs !== 'undefined') hljs.highlightAll();
      }

     function renderMarkdown() {
        if (typeof markdownit === 'undefined') {
          contentEl.innerHTML = '<p>markdown-it 未加载成功，请检查 markdown-it.min.js</p>';
          return;
        }
      
        var text = rawText;
        var mathStore = [];
        text = text.replace(/\$\$([\s\S]+?)\$\$/g, function(match) {
          var key = 'MATHPLACEHOLDER' + mathStore.length + 'END';
          mathStore.push(match);
          return key;
        });
        text = text.replace(/\$([^$\n]+?)\$/g, function(match) {
          var key = 'MATHPLACEHOLDER' + mathStore.length + 'END';
          mathStore.push(match);
          return key;
        });
      
        var md = markdownit({ html: false, linkify: true, breaks: false });
        var html = md.render(text);
        html = html.replace(/MATHPLACEHOLDER(\d+)END/g, function(match, idx) {
          var formula = mathStore[parseInt(idx, 10)];
          return formula.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        });
      
        contentEl.innerHTML = '<div id="markdown-content">' + html + '</div>';
      
        if (typeof hljs !== 'undefined') {
          document.querySelectorAll('#markdown-content pre code').forEach(function(block) {
            hljs.highlightElement(block);
          });
        }
      
        mathRetries = 0;
        tryMathJax();
      }
      function tryMathJax() {
        if (typeof renderMathInElement === 'function') {
          try {
            renderMathInElement(contentEl, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
              ],
              throwOnError: false
            });
          } catch (err) {
            console.error('[KaTeX] error:', err);
          }
        } else if (mathRetries < 30) {
          mathRetries++;
          setTimeout(tryMathJax, 200);
        } else {
          console.warn('[KaTeX] not ready after 6s');
        }
      }

      function render() {
        if (currentMode === 'cpp') renderCpp();
        else renderMarkdown();
      }

      document.querySelectorAll('#mode-switcher button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          currentMode = btn.dataset.mode;
          document.querySelectorAll('#mode-switcher button').forEach(function(b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          render();
        });
      });

      render();
    })();
  </script>
