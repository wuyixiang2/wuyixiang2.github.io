  <textarea id="rawSource" style="display:none">#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;algorithm&gt;
#define int long long
using namespace std;
int L,n,c[300005],nc[300005];
string s;
int cost(int x)//计算x开始来匹配的代价
{
    int sum = 0;
    for(int i = x;i &lt;= x + L - 1;i ++)
    {
        if(i == x &amp;&amp; s[i] == 'O')sum += c[i];
        if(i != x &amp;&amp; s[i] == 'M')sum += c[i];
    }
    return sum;
}
bool cmp(int b,int c)//直接按照斜率排序即可，这里的x坐标差值都是1。
{
    return b &lt; c;
}
vector&lt;int&gt; minkefu(vector&lt;int&gt;ze,vector&lt;int&gt;ye)
{
    vector&lt;int&gt;res(ze.size() + ye.size() - 1);
    res[0] = ze[0] + ye[0];
    for(int i = 0;i + 1 &lt; ze.size();i ++)ze[i] = ze[i + 1] - ze[i];
    for(int i = 0;i + 1 &lt; ye.size();i ++)ye[i] = ye[i + 1] - ye[i];
    ze.pop_back(),ye.pop_back();
    merge(ze.begin(),ze.end(),ye.begin(),ye.end(),res.begin() + 1,cmp);
    for(int i = 1;i &lt; res.size();i ++)res[i] += res[i - 1];
    return res;
}
struct node{
    vector&lt;int&gt;dp[3][3];
};
vector&lt;int&gt; min(vector&lt;int&gt;x,vector&lt;int&gt;y)
{
    for(int i = 0;i &lt; min(x.size(),y.size());i ++)x[i] = y[i] = min(x[i],y[i]);
    return (x.size() &gt; y.size() ? x : y);
}
void get_min(node &amp;ans)//子集取min，这里其实用到了高维前缀和的思路。
{
    for(int i = L - 2;i &gt;= 0;i --)
        for(int j = 0;j &lt; L;j ++)ans.dp[i][j] = min(ans.dp[i][j],ans.dp[i + 1][j]);
    for(int i = 0;i &lt; L;i ++)
        for(int j = L - 2;j &gt;= 0;j --)ans.dp[i][j] = min(ans.dp[i][j],ans.dp[i][j + 1]);
}
node dfs(int x,int y)
{
    if(y - x + 1 &lt; 2 * L)//暴力部分
    {
        node ans;
        for(int i = 0;i &lt; L;i ++)
            for(int j = 0;j &lt; L;j ++)ans.dp[i][j].resize(1);//第0项需要占位，其实它是没用的。
        for(int i = x;i + L - 1 &lt;= y;i ++)
        {
            int j = i + L - 1;
            ans.dp[i - x][y - j].push_back(cost(i));//存上匹配1个的代价
        }
        get_min(ans);
        return ans;
    }
    int mid = (x + y) &gt;&gt; 1;
    node l = dfs(x,mid),r = dfs(mid + 1,y),res;
    for(int i = 0;i &lt; L;i ++)
        for(int j = 0;j &lt; L;j ++)
        {
            res.dp[i][j] = minkefu(l.dp[i][0],r.dp[0][j]);//第一种转移
            for(int k = 1;k &lt; L;k ++)res.dp[i][j] = min(res.dp[i][j],minkefu(minkefu(l.dp[i][k],r.dp[L - k][j]),{0,nc[mid - k + 1]}));//第二种转移
        }
    return res;
}
signed main()
{
    ios::sync_with_stdio(0);
    cin.tie(0),cout.tie(0);
    cin &gt;&gt; L &gt;&gt; n &gt;&gt; s;
    s = " " + s;
    for(int i = 1;i &lt;= n;i ++)cin &gt;&gt; c[i];
    for(int i = 1;i &lt;= n - L + 1;i ++)nc[i] = cost(i);
    node ans = dfs(1,n);
    for(int i = 1;i &lt;= n / L;i ++)cout &lt;&lt; ans.dp[0][0][i] &lt;&lt; '\n';
}</textarea>

  <script>
    (function() {
      var rawText = document.getElementById('rawSource').value;
      var currentMode = 'cpp';
      var contentEl = document.getElementById('content');
      var mathRetries = 0;

      function renderCpp() {
        contentEl.innerHTML = '';
        var pre = document.createElement('pre');
        var codeEl = document.createElement('code');
        codeEl.className = 'language-cpp';
        codeEl.textContent = rawText;
        pre.appendChild(codeEl);
        contentEl.appendChild(pre);
        if (typeof hljs !== 'undefined') hljs.highlightAll();
      }

     function renderMarkdown() {
        if (typeof markdownit === 'undefined') {
          contentEl.innerHTML = '<p>markdown-it 未加载成功，请检查 markdown-it.min.js</p>';
          return;
        }
      
        var text = rawText;
        var mathStore = [];
        text = text.replace(/\$\$([\s\S]+?)\$\$/g, function(match) {
          var key = 'MATHPLACEHOLDER' + mathStore.length + 'END';
          mathStore.push(match);
          return key;
        });
        text = text.replace(/\$([^$\n]+?)\$/g, function(match) {
          var key = 'MATHPLACEHOLDER' + mathStore.length + 'END';
          mathStore.push(match);
          return key;
        });
      
        var md = markdownit({ html: false, linkify: true, breaks: false });
        var html = md.render(text);
        html = html.replace(/MATHPLACEHOLDER(\d+)END/g, function(match, idx) {
          var formula = mathStore[parseInt(idx, 10)];
          return formula.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        });
      
        contentEl.innerHTML = '<div id="markdown-content">' + html + '</div>';
      
        if (typeof hljs !== 'undefined') {
          document.querySelectorAll('#markdown-content pre code').forEach(function(block) {
            hljs.highlightElement(block);
          });
        }
      
        mathRetries = 0;
        tryMathJax();
      }
      function tryMathJax() {
        if (typeof renderMathInElement === 'function') {
          try {
            renderMathInElement(contentEl, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
              ],
              throwOnError: false
            });
          } catch (err) {
            console.error('[KaTeX] error:', err);
          }
        } else if (mathRetries < 30) {
          mathRetries++;
          setTimeout(tryMathJax, 200);
        } else {
          console.warn('[KaTeX] not ready after 6s');
        }
      }

      function render() {
        if (currentMode === 'cpp') renderCpp();
        else renderMarkdown();
      }

      document.querySelectorAll('#mode-switcher button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          currentMode = btn.dataset.mode;
          document.querySelectorAll('#mode-switcher button').forEach(function(b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          render();
        });
      });

      render();
    })();
  </script>
