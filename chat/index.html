<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chatroom</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      padding: 16px;
      max-width: 700px;
      margin: 0 auto;
    }
    #message-container {
      background: white;
      border: 1px solid #ccc;
      height: 65vh;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }
    .message-item {
      border-bottom: 1px solid #eee;
      padding: 6px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      font-size: 15px;
    }
    .message-user {
      font-weight: bold;
      color: #0b5e7c;
      margin-right: 12px;
    }
    .message-user.anonymous {
      color: #6c757d;
      font-weight: normal;
    }
    .message-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .message-time {
      color: #6c757d;
      font-size: 13px;
    }
    .delete-link {
      color: #6c757d;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
    }
    .delete-link:hover {
      color: #495057;
    }
    .message-text {
      width: 100%;
      margin-top: 2px;
      word-break: break-word;
      color: #1e293b;
    }
    #input-area {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    #msg-input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      min-width: 150px;
    }
    #send-btn {
      padding: 8px 18px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
    }
    #send-btn:hover { background: #0b5ed7; }
    .empty-tip { color: #6c757d; text-align: center; padding: 30px 0; }
    #identity-hint { font-size: 14px; color: #495057; margin-bottom: 6px; }
  </style>
</head>
<body>

  <div id="identity-hint"></div>
  <div id="message-container"></div>
  <div id="input-area">
    <input type="text" id="msg-input" placeholder="Input your message here..." />
    <button id="send-btn">Send</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://tsizgxzjylnbtrpczeyj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzaXpneHpqeWxuYnRycGN6ZXlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NjcyMzksImV4cCI6MjEwNzM0MzIzOX0.NoQf2rH5Kl6fbohNARIkF6ZLXtiWGcBUXTExzeJS3is';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const container = document.getElementById('message-container');
    const input = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const identityHint = document.getElementById('identity-hint');
    const ADMIN_USER = 'wuyixiang';
    function getCurrentUser() {
      const nickname = localStorage.getItem('userNickname');
      return (nickname && nickname.trim() !== '') ? nickname.trim() : 'Anonymous';
    }

    function updateIdentityHint() {
      identityHint.textContent = 'Your name:' + getCurrentUser();
    }
    function renderMessage(msg) {
      const item = document.createElement('div');
      item.className = 'message-item';
      item.dataset.id = msg.id;  
      const userSpan = document.createElement('span');
      userSpan.className = 'message-user';
      const userName = msg.user_name || 'Anonymous';
      userSpan.textContent = userName;
      if (userName === 'Anonymous') userSpan.classList.add('anonymous');
      const metaSpan = document.createElement('span');
      metaSpan.className = 'message-meta';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'message-time';
      let timeStr = 'Unknown Time';
      if (msg.created_at) {
        try {
          const date = new Date(msg.created_at);
          if (!isNaN(date.getTime())) {
            timeStr = date.toLocaleString('zh-CN', { hour12: false });
          }
        } catch (e) {}
      }
      timeSpan.textContent = timeStr;
      metaSpan.appendChild(timeSpan);
      if (getCurrentUser() === ADMIN_USER) {
        const delLink = document.createElement('a');
        delLink.className = 'delete-link';
        delLink.textContent = '删除';
        delLink.addEventListener('click', function() {
          deleteMessage(msg.id);
        });
        metaSpan.appendChild(delLink);
      }
      const textDiv = document.createElement('div');
      textDiv.className = 'message-text';
      textDiv.textContent = msg.text || '';

      item.appendChild(userSpan);
      item.appendChild(metaSpan);
      item.appendChild(textDiv);
      container.appendChild(item);
    }
    async function deleteMessage(id) {
      if (!confirm('确定删除这条消息吗？')) return;
      const { error } = await supabaseClient
        .from('messages')
        .delete()
        .eq('id', id);

      if (error) {
        console.error('删除失败:', error);
        alert('删除失败：' + error.message);
        return;
      }
      const el = container.querySelector('[data-id="' + id + '"]');
      if (el) el.remove();
      if (container.children.length === 0) {
        container.innerHTML = '<div class="empty-tip">No messages here</div>';
      }
    }
    async function loadHistory() {
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(500);
      container.innerHTML = '';
      if (error) {
        console.error('default:', error);
        container.innerHTML = '<div class="empty-tip">Loading Failed,please reflush the page</div>';
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-tip">No messages here</div>';
        return;
      }

      data.forEach(renderMessage);
      container.scrollTop = container.scrollHeight;
    }
    function subscribeRealtime() {
      supabaseClient
        .channel('public:messages')
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'messages' },
          (payload) => {
            const emptyTip = container.querySelector('.empty-tip');
            if (emptyTip) emptyTip.remove();

            renderMessage(payload.new);
            container.scrollTop = container.scrollHeight;
          }
        )
        .on(
          'postgres_changes',
          { event: 'DELETE', schema: 'public', table: 'messages' },
          (payload) => {
            const id = payload.old && payload.old.id;
            if (id === undefined) return;
            const el = container.querySelector('[data-id="' + id + '"]');
            if (el) el.remove();
            if (container.children.length === 0) {
              container.innerHTML = '<div class="empty-tip">No messages here</div>';
            }
          }
        )
        .subscribe((status) => {
          console.log('[Realtime] 订阅状态:', status);
        });
    }
    async function sendMessage() {
      const text = input.value.trim();
      if (text === '') {
        alert("Can't send an empty message!");
        return;
      }
      const user = getCurrentUser();
      const { error } = await supabaseClient
        .from('messages')
        .insert({ user_name: user, text: text });
      if (error) {
        console.error('Sending failed:', error);
        alert('Sending failed：' + error.message);
        return;
      }
      input.value = '';
      input.focus();
      updateIdentityHint();
    }
    function init() {
      updateIdentityHint();
      loadHistory();
      subscribeRealtime();

      sendBtn.addEventListener('click', sendMessage);
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendMessage();
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
